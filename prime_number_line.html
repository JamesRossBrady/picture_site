<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prime Numbers 0–1000</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body {
    background: #0d0d0d;
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #header {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 14px 22px;
    border-bottom: 1px solid #222;
  }
  .header-top {
    display: flex;
    align-items: center;
    gap: 20px;
  }
  #header h1 { font-size: 17px; color: #e0e0e0; font-weight: 700; letter-spacing: 0.3px; }
  #header .legend { font-size: 12px; color: #888; display: flex; align-items: center; gap: 6px; }
  #header .legend .swatch {
    display: inline-block;
    width: 11px; height: 11px;
    border-radius: 50%;
    vertical-align: middle;
  }
  #header .legend .swatch.prime  { background: #ff6b6b; }
  #header .legend .swatch.factor { background: #86e0a8; }
  #header .hint { margin-left: auto; font-size: 12px; color: #555; }
  .prime-check {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 13px;
    color: #aaa;
  }
  #prime-input {
    width: 90px;
    background: #141416;
    color: #e0e0e0;
    border: 1px solid #444;
    border-radius: 5px;
    padding: 5px 8px;
    font-size: 14px;
    font-family: inherit;
    text-align: center;
  }
  #prime-input:focus { outline: none; border-color: #888; }
  #prime-result {
    font-size: 18px;
    font-weight: 700;
    min-width: 24px;
    text-align: center;
  }
  #scroll {
    flex: 1;
    overflow: hidden;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #scroll:active { cursor: grabbing; }
  #scroll svg { display: block; height: 100%; }

  /* Custom 81px-tall scrollbar with arrows on the thumb (works in all browsers) */
  #scrollbar {
    flex-shrink: 0;
    height: 81px;
    background: #1a1a1a;
    border-top: 1px solid #222;
    position: relative;
    cursor: pointer;
  }
  #scrollbar-thumb {
    position: absolute;
    top: 3px;
    height: 75px;
    background: #666;
    border-radius: 20px;
    min-width: 166px;
    cursor: grab;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    box-sizing: border-box;
  }
  #scrollbar-thumb:hover { background: #888; }
  .thumb-arrow {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    font-size: 24px;
    line-height: 0;
    color: #fff;
    user-select: none;
    pointer-events: none;
  }
  /* tails (stems): centered on each arrowhead, running inward.
     Width = height * 4 * 1.618 = 4px * 4 * 1.618 ≈ 26px, white, square edges. */
  #thumb-left::after,
  #thumb-right::before {
    content: '';
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 26px;
    height: 4px;
    background: #fff;
  }
  #thumb-left::after { left: 100%; }
  #thumb-right::before { right: 100%; }
</style>
</head>
<body>
  <div id="header">
    <div class="header-top">
      <h1>Prime Numbers 0–1000</h1>
      <div class="legend"><span class="swatch prime"></span>prime</div>
      <div class="legend"><span class="swatch factor"></span>factor — each prime has its own color</div>
      <div class="hint">grab &amp; slide to explore</div>
    </div>
    <div class="prime-check">
      <span>enter number for prime check:</span>
      <input type="number" id="prime-input" min="0" max="1000" placeholder="0–1000">
      <span id="prime-result"></span>
    </div>
  </div>
  <div id="scroll">
    <svg id="line"></svg>
  </div>
  <div id="scrollbar">
    <div id="scrollbar-thumb">
      <span class="thumb-arrow" id="thumb-left">&#9664;</span>
      <span class="thumb-arrow" id="thumb-right">&#9654;</span>
    </div>
  </div>

<script>
(function () {
  var MAX = 1000;
  var SPACING = 36;       // px per integer on the x-axis
  var PAD = 70;           // left/right padding
  var WIDTH = PAD * 2 + MAX * SPACING;
  var HEIGHT = 340;
  var BASELINE = 246;

  // Sieve of Eratosthenes
  var isPrime = new Array(MAX + 1).fill(true);
  isPrime[0] = isPrime[1] = false;
  for (var i = 2; i * i <= MAX; i++) {
    if (isPrime[i]) for (var j = i * i; j <= MAX; j += i) isPrime[j] = false;
  }

  // Prime factorization with multiplicity: 12 -> [2,2,3]
  function factorize(n) {
    var f = [], m = n;
    for (var p = 2; p * p <= m; p++) {
      while (m % p === 0) { f.push(p); m /= p; }
    }
    if (m > 1) f.push(m);
    return f;
  }

  var NS = 'http://www.w3.org/2000/svg';
  var svg = document.getElementById('line');
  svg.setAttribute('viewBox', '0 0 ' + WIDTH + ' ' + HEIGHT);
  svg.setAttribute('width', WIDTH);
  svg.setAttribute('height', HEIGHT);

  function x(n) { return PAD + n * SPACING; }
  function el(tag, attrs) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  // Baseline
  svg.appendChild(el('line', {
    x1: x(0), y1: BASELINE, x2: x(MAX), y2: BASELINE,
    stroke: '#555', 'stroke-width': 2
  }));

  var CIRCLE_R = 10;
  var CIRCLE_STEP = 24;   // vertical spacing between stacked circles
  var BOTTOM_CY = BASELINE - 18;
  var LABEL_Y = 22;       // grey number labels sit here (above the tallest stack)

  // Color map for repeated factors: same prime value -> same color,
  // so twins (x2) and triplets (x3) of a factor visually match.
  var primes = [];
  for (var p = 2; p <= MAX; p++) if (isPrime[p]) primes.push(p);
  var primeIndex = {};
  for (var pi = 0; pi < primes.length; pi++) primeIndex[primes[pi]] = pi;
  function factorColor(v) {
    // Golden-angle hue per prime value -> each prime gets a distinct color,
    // so repeated factors match and single factors are all different.
    var h = (primeIndex[v] * 137.508) % 360;
    return 'hsl(' + h.toFixed(1) + ',65%,72%)';
  }

  for (var n = 0; n <= MAX; n++) {
    var xx = x(n);

    // tick marks below the line
    var len, color;
    if (n % 10 === 0)      { len = 14; color = '#888'; }
    else if (n % 5 === 0)  { len = 9;  color = '#555'; }
    else                   { len = 5;  color = '#2c2c2c'; }
    svg.appendChild(el('line', {
      x1: xx, y1: BASELINE, x2: xx, y2: BASELINE + len,
      stroke: color, 'stroke-width': 1
    }));

    // factor stack: primes = 1 red circle, composites = factor circles
    var stackTop = null; // y of the stack's top edge (for the dashed stem)
    if (n >= 2) {
      if (isPrime[n]) {
        var cy0 = BOTTOM_CY;
        svg.appendChild(el('circle', { cx: xx, cy: cy0, r: CIRCLE_R, fill: '#ff6b6b' }));
        var tp = el('text', {
          x: xx, y: cy0 + 3, 'text-anchor': 'middle',
          fill: '#1a1a1a', 'font-size': 9, 'font-weight': 'bold'
        });
        tp.textContent = n;
        svg.appendChild(tp);
        stackTop = cy0 - CIRCLE_R;
      } else {
        var factors = factorize(n);
        for (var i = 0; i < factors.length; i++) {
          var f = factors[i];
          var cy = BOTTOM_CY - i * CIRCLE_STEP;
          svg.appendChild(el('circle', { cx: xx, cy: cy, r: CIRCLE_R, fill: factorColor(f) }));
          var t = el('text', {
            x: xx, y: cy + 3, 'text-anchor': 'middle',
            fill: '#1a1a1a', 'font-size': 9, 'font-weight': 'bold'
          });
          t.textContent = f;
          svg.appendChild(t);
        }
        stackTop = BOTTOM_CY - (factors.length - 1) * CIRCLE_STEP - CIRCLE_R;
      }

      // dashed stem connecting the stack top up to the label line
      svg.appendChild(el('line', {
        x1: xx, y1: stackTop, x2: xx, y2: LABEL_Y + 4,
        stroke: '#666', 'stroke-width': 1, 'stroke-dasharray': '3 4'
      }));
    }

    // grey number label for every number, all at the same level (above stacks)
    var lbl = el('text', {
      x: xx, y: LABEL_Y, 'text-anchor': 'middle',
      fill: '#999', 'font-size': 9
    });
    lbl.textContent = n;
    svg.appendChild(lbl);
  }

  // Mathematical constants marked below the number line
  var CONSTANTS = [
    { symbol: '\u03C6', value: 1.61803, dy: 0  }, // phi (golden ratio)
    { symbol: 'e',      value: 2.71828, dy: 0  }, // Euler's number
    { symbol: '\u03C0', value: 3.14159, dy: 24 }  // pi (offset down to avoid e)
  ];
  var CONST_CIRCLE_Y = BASELINE + 45;

  for (var ci = 0; ci < CONSTANTS.length; ci++) {
    var c = CONSTANTS[ci];
    var cx = x(c.value);
    var cy = CONST_CIRCLE_Y + c.dy;

    // dashed line down from the baseline to the grey circle
    svg.appendChild(el('line', {
      x1: cx, y1: BASELINE, x2: cx, y2: cy - CIRCLE_R,
      stroke: '#666', 'stroke-width': 1, 'stroke-dasharray': '3 4'
    }));

    // grey circle (same size as the factor circles)
    svg.appendChild(el('circle', { cx: cx, cy: cy, r: CIRCLE_R, fill: '#999' }));

    // black symbol inside the circle (same size as the other labels)
    var clabel = el('text', {
      x: cx, y: cy + 3, 'text-anchor': 'middle',
      fill: '#1a1a1a', 'font-size': 9, 'font-weight': 'bold'
    });
    clabel.textContent = c.symbol;
    svg.appendChild(clabel);
  }

  // Translate vertical wheel into horizontal scroll
  var scroll = document.getElementById('scroll');
  scroll.addEventListener('wheel', function (e) {
    if (e.deltaY !== 0) { e.preventDefault(); scroll.scrollLeft += e.deltaY; }
  }, { passive: false });

  // Grab anywhere & slide (drag) to scroll the number line
  var dragging = false;
  var startX = 0, startLeft = 0;

  scroll.addEventListener('pointerdown', function (e) {
    dragging = true;
    startX = e.clientX;
    startLeft = scroll.scrollLeft;
    scroll.setPointerCapture(e.pointerId);
  });

  scroll.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    scroll.scrollLeft = startLeft + (e.clientX - startX);
  });

  function stopDrag() { dragging = false; }
  scroll.addEventListener('pointerup', stopDrag);
  scroll.addEventListener('pointercancel', stopDrag);

  // Prime check input
  var input = document.getElementById('prime-input');
  var result = document.getElementById('prime-result');

  function scrollToNumber(n) {
    var svg = document.getElementById('line');
    var scaleX = svg.getBoundingClientRect().width / WIDTH;
    var px = (PAD + n * SPACING) * scaleX;
    scroll.scrollLeft = Math.max(0, px - scroll.clientWidth / 2);
  }

  function checkPrime() {
    var v = parseInt(input.value, 10);
    if (isNaN(v) || v < 0 || v > MAX) {
      result.textContent = '';
      return;
    }
    if (isPrime[v]) {
      result.textContent = '\u2713';   // ✓ check mark
      result.style.color = '#4ade80'; // green
    } else {
      result.textContent = '\u2717';   // ✗ ballot x
      result.style.color = '#ef4444'; // red
    }
    scrollToNumber(v);
  }

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === 'Tab') {
      e.preventDefault();
      checkPrime();
    }
  });

  // Custom scrollbar (works in all browsers)
  var scrollbar = document.getElementById('scrollbar');
  var thumb = document.getElementById('scrollbar-thumb');

  function updateThumb() {
    var trackW = scrollbar.clientWidth;
    var contentW = scroll.scrollWidth;
    var viewW = scroll.clientWidth;
    var maxScroll = contentW - viewW;
    var thumbW = Math.max(60, (viewW / contentW) * trackW);
    thumb.style.width = thumbW + 'px';
    var maxLeft = trackW - thumbW;
    var left = maxScroll > 0 ? (scroll.scrollLeft / maxScroll) * maxLeft : 0;
    thumb.style.left = left + 'px';
  }

  scroll.addEventListener('scroll', updateThumb);

  var thumbDragging = false;
  var thumbStartX = 0, thumbStartLeft = 0;

  thumb.addEventListener('pointerdown', function (e) {
    thumbDragging = true;
    thumbStartX = e.clientX;
    thumbStartLeft = thumb.offsetLeft;
    thumb.setPointerCapture(e.pointerId);
    e.preventDefault();
  });

  thumb.addEventListener('pointermove', function (e) {
    if (!thumbDragging) return;
    var trackW = scrollbar.clientWidth;
    var thumbW = thumb.offsetWidth;
    var maxLeft = trackW - thumbW;
    var newLeft = Math.max(0, Math.min(maxLeft, thumbStartLeft + (e.clientX - thumbStartX)));
    thumb.style.left = newLeft + 'px';
    var maxScroll = scroll.scrollWidth - scroll.clientWidth;
    if (maxLeft > 0) scroll.scrollLeft = (newLeft / maxLeft) * maxScroll;
  });

  function stopThumbDrag() { thumbDragging = false; }
  thumb.addEventListener('pointerup', stopThumbDrag);
  thumb.addEventListener('pointercancel', stopThumbDrag);

  updateThumb();
  window.addEventListener('resize', updateThumb);
})();
</script>
</body>
</html>
