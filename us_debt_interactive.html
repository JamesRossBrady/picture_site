const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDate = (day) => {
  const d = new Date(EPOCH + day * 86400000);
  return MONTHS[d.getUTCMonth()] + ' ' + d.getUTCDate() + ', ' + d.getUTCFullYear();
};

// Range
const x0 = DEBT[0][0];
const x1 = DEBT[DEBT.length - 1][0];
const maxDebt = Math.max(...DEBT.map(p => p[1]));
const maxInt  = Math.max(...INTEREST.map(p => p[1]));

function niceStep(max, target) {
  const raw = max / target;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  let step = 10;
  if (norm < 1.5) step = 1; else if (norm < 3) step = 2; else if (norm < 7) step = 5;
  return step * mag;
}
const debtStep = niceStep(maxDebt, 5);
const intStep  = niceStep(maxInt, 5);
const debtMax  = Math.ceil(maxDebt / debtStep) * debtStep;
const intMax   = Math.ceil(maxInt / intStep) * intStep;

function interp(arr, day) {
  if (day <= arr[0][0]) return arr[0][1];
  if (day >= arr[arr.length - 1][0]) return arr[arr.length - 1][1];
  let lo = 0, hi = arr.length - 1;
  while (hi - lo > 1) {
    const mid = (lo + hi) >> 1;
    if (arr[mid][0] <= day) lo = mid; else hi = mid;
  }
  const t = (day - arr[lo][0]) / (arr[hi][0] - arr[lo][0]);
  return arr[lo][1] + t * (arr[hi][1] - arr[lo][1]);
}

const canvas = document.getElementById('chart');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, dpr = 1;
let cursor = null; // {px, day} while hovering inside the plot area
let showPresidents = false;

const PRESIDENTS = [
  { name: 'Clinton',   party: 'D', start: Date.UTC(1993,0,20), end: Date.UTC(2001,0,20) },
  { name: 'G.W. Bush', party: 'R', start: Date.UTC(2001,0,20), end: Date.UTC(2009,0,20) },

  { name: 'Biden',     party: 'D', start: Date.UTC(2021,0,20), end: Date.UTC(2025,0,20) },
  { name: 'Trump',     party: 'R', start: Date.UTC(2025,0,20), end: Date.UTC(2029,0,20) }
];

const L = 66, R = 78, T = 26, B = 44;

function xToPx(day) { return L + (day - x0) / (x1 - x0) * (W - L - R); }
function pxToDay(px) {
  let day = x0 + (px - L) / (W - L - R) * (x1 - x0);
  return Math.min(x1, Math.max(x0, day));
}
function debtToY(d) { return T + (1 - d / debtMax) * (H - T - B); }
function intToY(i)  { return T + (1 - i / intMax) * (H - T - B); }

function draw() {
  ctx.clearRect(0, 0, W, H);
  const pw = W - L - R, ph = H - T - B;

  // Y-axis titles (color-coded to the lines)
  ctx.font = 'bold 12px -apple-system, Segoe UI, Roboto, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.save();
  ctx.translate(16, T + ph / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.fillStyle = '#4a9eff';
  ctx.fillText('Debt ($T)', 0, 0);
  ctx.restore();
  ctx.save();
  ctx.translate(W - 16, T + ph / 2);
  ctx.rotate(Math.PI / 2);
  ctx.fillStyle = '#ff6b6b';
  ctx.fillText('Interest ($T/yr)', 0, 0);
  ctx.restore();

  // Grid + Y ticks
  ctx.font = '12px -apple-system, Segoe UI, Roboto, sans-serif';
  ctx.textBaseline = 'middle';
  for (let v = 0; v <= debtMax + 1e-9; v += debtStep) {
    const y = debtToY(v);
    ctx.strokeStyle = '#242424'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(W - R, y); ctx.stroke();
    ctx.fillStyle = '#999'; ctx.textAlign = 'right';
    ctx.fillText('$' + v.toFixed(0) + 'T', L - 10, y);
  }
  for (let v = 0; v <= intMax + 1e-9; v += intStep) {
    const y = intToY(v);
    ctx.strokeStyle = 'rgba(255,107,107,0.12)'; ctx.lineWidth = 1;
    ctx.setLineDash([3, 5]);
    ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(W - R, y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#c96'; ctx.textAlign = 'left';
    ctx.fillText('$' + (v / 1000).toFixed(1) + 'T', W - R + 10, y);
  }

  // X ticks (years)
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  const firstYear = new Date(EPOCH + x0 * 86400000).getUTCFullYear();
  const lastYear = new Date(EPOCH + x1 * 86400000).getUTCFullYear();
  for (let y = firstYear; y <= lastYear; y++) {
    const jan1 = Date.UTC(y, 0, 1);
    const day = Math.round((jan1 - EPOCH) / 86400000);
    if (day < x0 || day > x1) continue;
    const px = xToPx(day);
    ctx.strokeStyle = '#242424'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(px, T); ctx.lineTo(px, H - B); ctx.stroke();
    ctx.fillStyle = '#888';
    ctx.fillText(String(y), px, H - B + 8);
  }

  // President term bands (toggled by the "president" header)
  if (showPresidents) {
    for (const p of PRESIDENTS) {
      const d0 = Math.round((p.start - EPOCH) / 86400000);
      const d1 = Math.round((p.end - EPOCH) / 86400000);
      const xa = Math.max(L, xToPx(d0));
      const xb = Math.min(W - R, xToPx(d1));
      if (xb <= xa) continue;
      ctx.fillStyle = p.party === 'R' ? 'rgba(255,80,80,0.13)' : 'rgba(80,130,255,0.13)';
      ctx.fillRect(xa, T, xb - xa, H - T - B);
      ctx.fillStyle = p.party === 'R' ? 'rgba(255,160,160,0.8)' : 'rgba(170,190,255,0.8)';
      ctx.font = '10px -apple-system, Segoe UI, Roboto, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(p.name, (xa + xb) / 2, T + 3);
    }
  }

  // Interest line (draw first so debt is on top)
  if (INTEREST.length) {
    ctx.strokeStyle = '#ff6b6b'; ctx.lineWidth = 2.2; ctx.lineJoin = 'round';
    ctx.beginPath();
    for (let i = 0; i < INTEREST.length; i++) {
      const px = xToPx(INTEREST[i][0]), py = intToY(INTEREST[i][1]);
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.stroke();
  }

  // Debt line
  ctx.strokeStyle = '#4a9eff'; ctx.lineWidth = 2.2; ctx.lineJoin = 'round';
  ctx.beginPath();
  for (let i = 0; i < DEBT.length; i++) {
    const px = xToPx(DEBT[i][0]), py = debtToY(DEBT[i][1]);
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.stroke();

  // Cursor vertical line + readout
  if (cursor) {
    const px = cursor.px;
    if (px >= L && px <= W - R) {
      ctx.strokeStyle = '#ffcc00'; ctx.lineWidth = 1.4;
      ctx.setLineDash([5, 4]);
      ctx.beginPath(); ctx.moveTo(px, T); ctx.lineTo(px, H - B); ctx.stroke();
      ctx.setLineDash([]);

      // Blue horizontal line (total debt) — runs left from the cursor
      const debtY = debtToY(interp(DEBT, cursor.day));
      ctx.strokeStyle = '#4a9eff'; ctx.lineWidth = 1.4;
      ctx.setLineDash([5, 4]);
      ctx.beginPath(); ctx.moveTo(L, debtY); ctx.lineTo(px, debtY); ctx.stroke();
      ctx.setLineDash([]);

      // Red horizontal line (interest) — runs right from the cursor
      if (cursor.day >= INTEREST[0][0]) {
        const intY = intToY(interp(INTEREST, cursor.day));
        ctx.strokeStyle = '#ff6b6b'; ctx.lineWidth = 1.4;
        ctx.setLineDash([5, 4]);
        ctx.beginPath(); ctx.moveTo(px, intY); ctx.lineTo(W - R, intY); ctx.stroke();
        ctx.setLineDash([]);
      }

      const label = fmtDate(Math.round(cursor.day));
      ctx.font = 'bold 12px -apple-system, Segoe UI, Roboto, sans-serif';
      const tw = ctx.measureText(label).width + 16;
      let bx = px + 10; if (bx + tw > W - R) bx = px - tw - 10;
      ctx.fillStyle = 'rgba(20,20,20,0.92)';
      ctx.strokeStyle = '#555'; ctx.lineWidth = 1;
      ctx.fillRect(bx, T + 4, tw, 24);
      ctx.strokeRect(bx + 0.5, T + 4.5, tw, 24);
      ctx.fillStyle = '#ffcc00'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(label, bx + 8, T + 16);
    }
  }
}

function fillBoxes(day) {
  document.getElementById('v-date').textContent = fmtDate(Math.round(day));
  const debtT = interp(DEBT, day);
  document.getElementById('v-debt').textContent = '$' + debtT.toFixed(2) + 'T';
  if (day >= INTEREST[0][0]) {
    const intT = interp(INTEREST, day) / 1000;
    document.getElementById('v-interest').textContent =
      '$' + intT.toFixed(2) + 'T/yr';
  } else {
    document.getElementById('v-interest').textContent = '—';
  }
}

function resize() {
  dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  W = rect.width; H = rect.height;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const px = e.clientX - rect.left;
  if (px >= L && px <= W - R) {
    cursor = { px, day: pxToDay(px) };
  } else {
    cursor = null;
  }
  draw();
});
canvas.addEventListener('mouseleave', () => { cursor = null; draw(); });
canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const px = e.clientX - rect.left;
  if (px >= L && px <= W - R) fillBoxes(pxToDay(px));
});

const presidentToggle = document.getElementById('president-toggle');
presidentToggle.addEventListener('click', () => {
  showPresidents = !showPresidents;
  presidentToggle.classList.toggle('on', showPresidents);
  draw();
});

window.addEventListener('resize', resize);
resize();
fillBoxes(x1); // initialize with latest values
</script>
</body>
</html>
